<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Subtle glow dot -->
  <circle cx="24" cy="8" r="2" fill="url(#glowGrad)" />

  <!-- Modern Geometric 'S' Monogram -->
  <path d="M21 11.5 C21 9.8 19.4 8.5 16.5 8.5 C13.2 8.5 11.2 10.2 11.2 12.4 C11.2 14.3 12.6 15.3 15.2 16.0 L16.8 16.4 C19.2 17.0 20.8 18.0 20.8 20.2 C20.8 22.8 18.4 24.5 15.2 24.5 C11.8 24.5 9.8 22.8 9.5 20.5" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
